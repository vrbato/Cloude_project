<!doctype html>
<html lang="cs">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Valuace akcií</title>
    <meta name="description" content="Vnitřní hodnota akcie ve třech scénářích (DCF) a dashboard klíčových ukazatelů." />

    <!-- PWA / iPhone -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="theme-color" content="#07090f" media="(prefers-color-scheme: dark)" />
    <meta name="theme-color" content="#f1f3f8" media="(prefers-color-scheme: light)" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Valuace" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <link rel="icon" href="/icons/icon.svg" type="image/svg+xml" />
    <link rel="icon" href="/icons/icon-192.png" sizes="192x192" type="image/png" />

    <script>
      // Téma nastavíme před vykreslením, aby stránka neproblikla
      try {
        const t = localStorage.getItem("valuace:theme");
        if (t === "light" || t === "dark") document.documentElement.dataset.theme = t;
      } catch {}
    </script>
    <link rel="stylesheet" href="/css/app.css" />
    <link rel="modulepreload" href="/js/app.js" />
  </head>
  <body>
    <header class="topbar">
      <div class="container topbar__inner">
        <a class="brand" href="#" aria-label="Valuace – úvod">
          <span class="brand__mark" aria-hidden="true">
            <svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
              <path d="M4 17l5-5 4 3 7-8" />
              <path d="M15 7h5v5" />
            </svg>
          </span>
          <span class="brand__name">Valuace</span>
        </a>

        <form class="search" id="search" role="search" autocomplete="off">
          <label class="search__field">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true">
              <circle cx="11" cy="11" r="7" />
              <path d="M20 20l-3.5-3.5" />
            </svg>
            <span class="sr-only">Ticker nebo název firmy</span>
            <input
              id="search-input"
              type="search"
              inputmode="search"
              enterkeyhint="search"
              autocapitalize="characters"
              autocorrect="off"
              spellcheck="false"
              placeholder="Ticker nebo firma, např. AAPL"
              aria-autocomplete="list"
              aria-controls="search-results"
            />
          </label>
          <ul class="search__results" id="search-results" role="listbox" hidden></ul>
        </form>

        <button class="icon-btn theme-btn" id="theme-btn" type="button" aria-label="Přepnout vzhled">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true">
            <path d="M12 3a9 9 0 1 0 9 9 7 7 0 0 1-9-9z" />
          </svg>
        </button>
      </div>
    </header>

    <main class="container" id="app" aria-live="polite"></main>

    <div class="install" id="install" hidden>
      <div>
        <b>Přidejte si Valuaci na plochu</b><br />
        Klepněte na
        <svg class="share" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-label="Sdílet">
          <path d="M12 3v12" />
          <path d="M8 7l4-4 4 4" />
          <path d="M5 12v7a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2v-7" />
        </svg>
        <b>Sdílet</b> a pak <b>Přidat na plochu</b>.
      </div>
      <button class="icon-btn" id="install-close" type="button" aria-label="Zavřít">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true">
          <path d="M6 6l12 12M18 6L6 18" />
        </svg>
      </button>
    </div>

    <div class="sheet-backdrop" id="sheet" hidden>
      <div class="sheet" role="dialog" aria-modal="true" aria-labelledby="sheet-title">
        <div class="sheet__grab"></div>
        <h3 id="sheet-title"></h3>
        <div class="sheet__value" id="sheet-value"></div>
        <div id="sheet-body"></div>
        <button class="btn" id="sheet-close" type="button" style="width: 100%; margin-top: 8px">Zavřít</button>
      </div>
    </div>

    <script type="module" src="/js/app.js"></script>
  </body>
</html>
